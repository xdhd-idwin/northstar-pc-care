[package]
name = "northstar-pc-care"
version = "0.1.3"
description = "Windows system care desktop app"
authors = ["Northstar PC Care"]
license = "MIT"
repository = "https://github.com/xdhd-idwin/northstar-pc-care"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "northstar_pc_care_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.7", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
open = "5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

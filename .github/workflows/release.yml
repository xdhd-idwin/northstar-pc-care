name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version and updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($package.version -ne $tagVersion -or $config.version -ne $tagVersion) {
            throw "Release tag $tagVersion must match package and Tauri versions ($($package.version), $($config.version))."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Add the TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret. It signs automatic updates.'
          }

      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build

      - name: Create signed-update feed
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $bundle = Join-Path $PWD 'src-tauri/target/release/bundle/nsis'
          $archive = Get-ChildItem $bundle -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $archive) { throw 'Tauri NSIS installer was not generated.' }
          $signaturePath = "$($archive.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw 'Tauri updater signature was not generated.' }
          $assetName = [uri]::EscapeDataString($archive.Name)
          $feed = @{
            version = $version
            notes = "Northstar PC Care $version"
            pub_date = [DateTime]::UtcNow.ToString('o')
            platforms = @{
              'windows-x86_64' = @{
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$assetName"
                signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
              }
            }
          }
          $feed | ConvertTo-Json -Depth 10 | Set-Content 'src-tauri/target/release/bundle/nsis/latest.json' -Encoding utf8

      - name: Publish GitHub Release and update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $bundle = Join-Path $PWD 'src-tauri/target/release/bundle/nsis'
          $files = @(
            Get-ChildItem $bundle -File | Where-Object {
              $_.Name -match '\.exe(\.sig)?$' -or $_.Name -eq 'latest.json'
            } | ForEach-Object { $_.FullName }
          )
          if (!($files | Where-Object { $_ -match '\.exe$' })) { throw 'Windows installer was not generated.' }
          if (!($files | Where-Object { $_ -match '\.exe\.sig$' })) { throw 'Signed Windows update installer was not generated.' }
          if (!($files | Where-Object { $_ -match 'latest\.json$' })) { throw 'Automatic update metadata was not generated.' }
          gh release create $tag @files --title "Northstar PC Care $tag" --generate-notes --verify-tag
